<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册表单</title>
</head>
<body>
    <h1>用户注册</h1>
    <form action="#" method="post">
        <!-- 用户名输入 -->
        <div>
            <label for="username">用户名：</label>
            <input type="text" id="username" name="username" required placeholder="请输入用户名">
        </div>
        
        <!-- 电子邮件输入 -->
        <div>
            <label for="email">电子邮件：</label>
            <input type="email" id="email" name="email" required placeholder="请输入有效的电子邮件地址">
        </div>
        
        <!-- 密码输入 -->
        <div>
            <label for="password">密码：</label>
            <input type="password" id="password" name="password" required placeholder="请输入密码">
        </div>
        
        <!-- 确认密码输入 -->
        <div>
            <label for="confirm_password">确认密码：</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入密码">
        </div>
        
        <!-- 上传头像 -->
        <div>
            <label for="avatar">上传头像：</label>
            <input type="file" id="avatar" name="avatar" accept="image/*">
        </div>
        
        <!-- 个人简介 -->
        <div>
            <label for="bio">个人简介：</label>
            <textarea id="bio" name="bio" rows="4" cols="50" placeholder="简要介绍一下你自己..."></textarea>
        </div>
        
        <!-- 国家选择 -->
        <div>
            <label for="country">国家：</label>
            <select id="country" name="country">
                <option value="">请选择国家</option>
                <option value="china">中国</option>
                <option value="usa">美国</option>
                <option value="japan">日本</option>
                <option value="korea">韩国</option>
                <option value="germany">德国</option>
                <option value="france">法国</option>
                <option value="uk">英国</option>
                <option value="other">其他国家</option>
            </select>
        </div>
        
        <!-- 订阅新闻复选框 -->
        <div>
            <label for="newsletter">
                <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                订阅新闻邮件
            </label>
        </div>
        
        <!-- 注册按钮 -->
        <div>
            <button type="submit">注册</button>
        </div>
    </form>
</body>
</html>
